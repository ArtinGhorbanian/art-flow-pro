name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install audit tools and runtime lock
        run: python -m pip install --requirement requirements-dev.txt

      - name: Audit dependencies
        run: >-
          python -m pip_audit -s osv --requirement requirements.lock
          --no-deps --disable-pip --timeout 15

      - name: Scan Python source
        run: python -m bandit --recursive app.py --severity-level medium --confidence-level medium
