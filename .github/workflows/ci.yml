name: CI

on:
  push:
    branches: [main, "agent/**", "aionex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install verified dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check app.py tests
          python -m ruff format --check app.py tests

      - name: Type check
        run: python -m mypy --no-incremental app.py tests

      - name: Check browser JavaScript syntax
        run: node --check static/script.js

      - name: Compile
        run: python -m compileall -q app.py tests

      - name: Test
        env:
          APP_ENV: test
          OPENAI_API_KEY: ""
          PROXY_URL: direct
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m coverage run --branch -m pytest -q -p no:cacheprovider
          && python -m coverage report --show-missing --fail-under=58
