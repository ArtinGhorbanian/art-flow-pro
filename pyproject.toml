[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "art-flow-pro"
version = "0.1.1"
description = "A browser-based creative canvas and structured resume workspace with optional OpenAI-assisted tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
maintainers = [{ name = "AIONEX" }]
dependencies = [
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "httpx-socks==0.11.0",
  "jinja2==3.1.6",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "coverage==7.15.2",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "ruff==0.16.1",
]

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".aionex"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = [".venv", ".aionex", "tests"]
